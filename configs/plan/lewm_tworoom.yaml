backend: lewm
base_model_ref: tworoom_lewm
adapter_checkpoint: checkpoints/adapters/lewm_tworoom.pt
dataset_name: tworoom.h5
dataset_cache_dir: null
device: cuda
seed: 42

model:
  use_adapter: true

appearance:
  enabled: true
  protocol: fixed
  shift_type: composed
  severity: 1.0
  seed: 2026

world:
  env_name: swm/TwoRoom-v1

plan:
  horizon: 5
  receding_horizon: 1
  history_len: 3
  action_block: 5
  warm_start: true

cem:
  batch_size: 4
  num_samples: 300
  n_steps: 10
  topk: 30

eval:
  num_eval: 8
  goal_offset_steps: 25
  eval_budget: 50
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

output:
  video: false
  root_dir: outputs/plan/lewm_tworoom

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/plan_lewm

model_config: configs/model/jepa_wm_droid_place.yaml
method_configs:
  base: configs/method/base.yaml
  dct_adapter: configs/method/dct_adapter.yaml
  token_mlp: configs/method/token_mlp.yaml
  lora: configs/method/lora.yaml
method: dct_adapter
domain: ood
device: cuda
suite_mode: self_test
suite: {family: self_test, variant: full}
paths:
  dataset_root: ${oc.env:JEPAWM_DSET,''}
  robocasa_hdf5: ${oc.env:JEPAWM_ROBOCASA_HDF5,''}
  feature_cache: storage/self_test/feature_cache.h5
  method_checkpoint: checkpoints/self_test/${method}_final.pt
data: {task_name: PnPCounterTop, camera_view: robot0_leftview, num_frames: 4, frameskip: 5, num_train_windows: 16, episode_disjoint: true, train_fraction: 0.8, split_seed: 42, window_seed: 42}
appearance: {name: composed_photometric, pipeline_version: composed_photometric_v1, training_severity: 1.0, severity: 1.0, training_seed: 42, seed: 2026}
cache: {encoder_batch_size: 2, num_workers: 0}
training: {epochs: 1, batch_size: 2, gradient_accumulation: 1, lr: 1.0e-3, weight_decay: 1.0e-4, gradient_clip_norm: 1.0, precision: bf16, num_workers: 0, seed: 42, canonical_weight: 1.0, dynamics_weight: 1.0}
planning:
  task_slug: place
  history_len: 3
  candidate_chunk_size: 8
  inference_precision: bf16
  compile_predictor: false
  allow_tf32: true
  self_test: {iterations: 1, num_samples: 8, num_elites: 2, horizon: 1, max_episode_steps: 5}
offline: {num_frames: 6, num_windows: 4, batch_size: 1, num_workers: 0, output_directory: outputs/self_test/offline/dct_adapter}
evaluation: {num_episodes: 1, eval_seed: 42, tqdm_silent: false}
output: {root_dir: outputs/self_test}

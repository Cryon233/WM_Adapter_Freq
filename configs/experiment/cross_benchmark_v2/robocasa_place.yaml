model_config: configs/model/jepa_wm_droid_place.yaml
method_configs: &methods
  base: configs/method/base.yaml
  dct_adapter: configs/method/dct_adapter.yaml
  token_mlp: configs/method/token_mlp.yaml
  lora: configs/method/lora.yaml
  hfra: configs/method/hfra.yaml
  hfra_core_only: configs/method/hfra_core_only.yaml
method: hfra
domain: ood
device: cuda
suite_mode: formal
suite: {family: main, variant: full}
benchmark: {name: robocasa, suite: single_stage, task_key: robocasa_place, task_id: PnPCounterTop, task_name: PnPCounterTop, control_frequency_hz: 20.0}
paths:
  dataset_root: ${oc.env:JEPAWM_DSET,''}
  robocasa_hdf5: ${oc.env:ROBOCASA_PLACE_HDF5,${oc.env:JEPAWM_ROBOCASA_HDF5,''}}
  feature_cache: storage/feature_cache/cross_benchmark_v2/robocasa/robocasa_place.h5
  method_checkpoint: checkpoints/cross_benchmark_v2/robocasa/robocasa_place/${method}_final.pt
  task_manifest: outputs/cross_benchmark_v2/manifests/tasks/robocasa_place.json
  evaluation_manifest: outputs/cross_benchmark_v2/manifests/evaluation/robocasa_place.json
data: {task_name: PnPCounterTop, camera_view: robot0_leftview, num_frames: 6, context_frames: 3, future_frames: 3, frameskip: 5, num_train_windows: 2000, episode_disjoint: true, train_fraction: 0.8, split_seed: 42, window_seed: 42}
appearance: {name: composed_photometric, pipeline_version: composed_photometric_v1, training_severity_min: 0.5, training_severity_max: 1.5, severity: 1.0, training_seed: 42, seed: 2026}
cache: {schema_version: jepa_wm_feature_cache_v2, encoder_batch_size: 4, num_workers: 4}
training: &training {loss_name: unified_trajectory_mse, max_optimizer_steps: 2000, microbatch_windows: 2, views_per_window: 2, gradient_accumulation: 8, lr: 3.0e-4, betas: [0.9, 0.95], epsilon: 1.0e-8, weight_decay: 1.0e-4, warmup_steps: 100, scheduler: cosine, minimum_lr: 3.0e-5, gradient_clip_norm: 1.0, precision: bf16, num_workers: 4, seed: 42}
planning: {task_slug: place, subtask: place, history_len: 3, candidate_chunk_size: 300, inference_precision: bf16, compile_predictor: true, allow_tf32: true, self_test: {iterations: 1, num_samples: 8, num_elites: 2, horizon: 1, max_episode_steps: 5}}
offline: {num_frames: 6, num_windows: 200, seed: 42, shuffle_seed: 100045, negative_actions: 15, batch_size: 1, num_workers: 2, output_directory: outputs/cross_benchmark_v2/offline/main/robocasa/robocasa_place/hfra}
evaluation: {num_episodes: 20, eval_seed: 42, max_episode_steps: 60, goal_span_steps: 25, episode_cap_basis: pinned JEPA-WM RoboCasa protocol, tqdm_silent: false}
output: {root_dir: outputs/cross_benchmark_v2, run_directory: null}

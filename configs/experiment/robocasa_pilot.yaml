model_config: configs/model/jepa_wm_droid.yaml
method_configs:
  base: configs/method/base.yaml
  dct_adapter: configs/method/dct_adapter.yaml
  token_mlp: configs/method/token_mlp.yaml
  lora: configs/method/lora.yaml

method: dct_adapter
domain: ood
device: cuda

paths:
  dataset_root: ${oc.env:JEPAWM_DSET,''}
  robocasa_hdf5: ${oc.env:JEPAWM_ROBOCASA_HDF5,''}
  feature_cache: storage/feature_cache/jepa_wm_droid_robocasa_pilot.h5
  method_checkpoint: checkpoints/jepa_wm_droid/robocasa/${method}_final.pt

data:
  task_name: PnPCounterTop
  camera_view: robot0_leftview
  num_frames: 4
  frameskip: 5
  num_train_windows: 2000
  episode_disjoint: true
  train_fraction: 0.8
  split_seed: 42
  window_seed: 42

appearance:
  name: composed_photometric
  pipeline_version: composed_photometric_v1
  severity: 1.0
  training_seed: 42
  seed: 2026

cache:
  encoder_batch_size: 4
  num_workers: 4

training:
  epochs: 20
  batch_size: 4
  gradient_accumulation: 8
  lr: 1.0e-3
  weight_decay: 1.0e-4
  gradient_clip_norm: 1.0
  precision: bf16
  num_workers: 4
  seed: 42

planning:
  task_slug: place
  history_len: 3
  candidate_chunk_size: 300
  inference_precision: bf16
  compile_predictor: true
  allow_tf32: true

evaluation:
  num_episodes: 50
  eval_seed: 42
  tqdm_silent: false

output:
  root_dir: outputs

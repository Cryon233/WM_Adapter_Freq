model_config: configs/model/jepa_wm_droid.yaml
method_configs:
  base: configs/method/base.yaml
  dct_adapter: configs/method/dct_adapter.yaml
  token_mlp: configs/method/token_mlp.yaml
  lora: configs/method/lora.yaml
method: dct_adapter
domain: ood
device: cuda
suite_mode: formal
suite: {family: main, variant: full}
benchmark: {name: libero, suite: libero_spatial, task_key: libero_spatial_0, task_id: 0, task_name: registry_task_0, control_frequency_hz: 20.0}
paths:
  libero_root: ${oc.env:LIBERO_ROOT,''}
  dataset_root: ${oc.env:LIBERO_DATA_ROOT,''}
  libero_data_root: ${oc.env:LIBERO_DATA_ROOT,''}
  suite_data_root: ${oc.env:LIBERO_SPATIAL_DATA_ROOT,''}
  feature_cache: storage/feature_cache/cross_benchmark_v1/libero/libero_spatial_0.h5
  method_checkpoint: checkpoints/cross_benchmark_v1/libero/libero_spatial_0/${method}_final.pt
  task_manifest: outputs/cross_benchmark_v1/manifests/tasks/libero_spatial_0.json
  evaluation_manifest: outputs/cross_benchmark_v1/manifests/evaluation/libero_spatial_0.json
data: {task_name: registry_task_0, camera_view: agentview, num_frames: 4, frameskip: 5, num_train_windows: 2000, episode_disjoint: true, train_fraction: 0.6, split_seed: 42, window_seed: 42, vertical_flip: true}
appearance: {name: composed_photometric, pipeline_version: composed_photometric_v1, training_severity: 1.0, severity: 1.0, training_seed: 42, seed: 2026}
cache: {encoder_batch_size: 4, num_workers: 4}
training: {epochs: 20, batch_size: 4, gradient_accumulation: 8, lr: 1.0e-3, weight_decay: 1.0e-4, gradient_clip_norm: 1.0, precision: bf16, num_workers: 4, seed: 42, canonical_weight: 1.0, dynamics_weight: 1.0}
planning: {task_slug: libero_spatial_0, history_len: 3, candidate_chunk_size: 300, inference_precision: bf16, compile_predictor: true, allow_tf32: true, self_test: {iterations: 1, num_samples: 8, num_elites: 2, horizon: 1, max_episode_steps: 5}}
offline: {num_frames: 6, num_windows: 200, seed: 42, shuffle_seed: 100045, batch_size: 1, num_workers: 2, output_directory: outputs/cross_benchmark_v1/offline/main/libero/libero_spatial_0/dct_adapter}
evaluation: {num_episodes: 20, eval_seed: 42, max_episode_steps: 300, goal_span_steps: 0, episode_cap_basis: LIBERO official horizon at 20 Hz fixed before method evaluation, tqdm_silent: false}
output: {root_dir: outputs/cross_benchmark_v1, run_directory: null}

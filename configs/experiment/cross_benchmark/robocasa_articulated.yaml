model_config: configs/model/jepa_wm_droid_place.yaml
method_configs:
  base: configs/method/base.yaml
  dct_adapter: configs/method/dct_adapter.yaml
  token_mlp: configs/method/token_mlp.yaml
  lora: configs/method/lora.yaml
method: dct_adapter
domain: ood
device: cuda
suite_mode: formal
suite: {family: main, variant: full}
benchmark:
  name: robocasa
  suite: single_stage
  task_key: robocasa_articulated
  task_id: auto_articulated
  task_name: auto_articulated
  control_frequency_hz: 20.0
paths:
  dataset_root: ${oc.env:JEPAWM_DSET,''}
  robocasa_hdf5: ${oc.env:ROBOCASA_ARTICULATED_HDF5,''}
  candidate_datasets:
    OpenDrawer: ${oc.env:ROBOCASA_OPEN_DRAWER_HDF5,''}
    CloseDrawer: ${oc.env:ROBOCASA_CLOSE_DRAWER_HDF5,''}
    OpenCabinet: ${oc.env:ROBOCASA_OPEN_CABINET_HDF5,''}
    CloseCabinet: ${oc.env:ROBOCASA_CLOSE_CABINET_HDF5,''}
  feature_cache: storage/feature_cache/cross_benchmark_v1/robocasa/robocasa_articulated.h5
  method_checkpoint: checkpoints/cross_benchmark_v1/robocasa/robocasa_articulated/${method}_final.pt
  task_manifest: outputs/cross_benchmark_v1/manifests/tasks/robocasa_articulated.json
  evaluation_manifest: outputs/cross_benchmark_v1/manifests/evaluation/robocasa_articulated.json
data: {task_name: auto_articulated, camera_view: robot0_leftview, num_frames: 4, frameskip: 5, num_train_windows: 2000, episode_disjoint: true, train_fraction: 0.8, split_seed: 42, window_seed: 42}
appearance: {name: composed_photometric, pipeline_version: composed_photometric_v1, training_severity: 1.0, severity: 1.0, training_seed: 42, seed: 2026}
cache: {encoder_batch_size: 4, num_workers: 4}
training: {epochs: 20, batch_size: 4, gradient_accumulation: 8, lr: 1.0e-3, weight_decay: 1.0e-4, gradient_clip_norm: 1.0, precision: bf16, num_workers: 4, seed: 42, canonical_weight: 1.0, dynamics_weight: 1.0}
planning:
  task_slug: articulated
  subtask: null
  history_len: 3
  candidate_chunk_size: 300
  inference_precision: bf16
  compile_predictor: true
  allow_tf32: true
  self_test: {iterations: 1, num_samples: 8, num_elites: 2, horizon: 1, max_episode_steps: 5}
offline: {num_frames: 6, num_windows: 200, seed: 42, shuffle_seed: 100045, batch_size: 1, num_workers: 2, output_directory: outputs/cross_benchmark_v1/offline/main/robocasa/robocasa_articulated/dct_adapter}
evaluation: {num_episodes: 20, eval_seed: 42, max_episode_steps: 60, goal_span_steps: 25, episode_cap_basis: fixed before method evaluation from official task limit and 20 Hz control, tqdm_silent: false}
output: {root_dir: outputs/cross_benchmark_v1, run_directory: null}

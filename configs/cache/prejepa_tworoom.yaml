backend: prejepa
base_model_ref: tworoom_prejepa
dataset_name: tworoom.h5
dataset_cache_dir: null
output_path: data/features/prejepa_tworoom.h5
max_windows: 2000
encoder_batch_size: 8
writer_chunk_size: 64
num_workers: 4
seed: 42
device: cuda
image_size: 224

appearance:
  severity: 1.0

episode_split:
  strategy: deterministic_episode_partition_v1
  seed: 42
  train_fraction: 0.8

window_selection:
  strategy: episode_balanced_round_robin_v1
  seed: 42

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/cache_prejepa

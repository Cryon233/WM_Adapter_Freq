[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wm-adapter-freq"
version = "0.1.0"
description = "Sequence-Stable Adaptive DCT Adapter for latent world models"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops>=0.8",
    "h5py>=3.10",
    "hydra-core>=1.3",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

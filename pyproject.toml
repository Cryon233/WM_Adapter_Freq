[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "control-frequency-wm"
version = "0.1.0"
description = "Control-relevant visual adaptation for latent world models"
requires-python = ">=3.10,<3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

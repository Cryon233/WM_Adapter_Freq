suite_name: cross_backend_adapter_v1
protocol: cross_backend_adapter_v1
lifecycle: active
phases: [Feature caches, Main adapter training, Offline MSE, Closed-loop planning, Final analysis]
state_path: logs/cross_backend_adapter_v1/state.json
pid_path: logs/cross_backend_adapter_v1/runner.pid
runner_log: logs/cross_backend_adapter_v1/runner.log
log_root: logs/cross_backend_adapter_v1/jobs
storage_root: storage/feature_cache/cross_backend_adapter_v1
checkpoint_root: checkpoints/cross_backend_adapter_v1
output_root: outputs/cross_backend_adapter_v1
analysis_root: outputs/cross_backend_adapter_v1/analysis
manifest_root: outputs/cross_backend_adapter_v1/manifests
tasks:
  robocasa_reach: configs/experiment/cross_backend_adapter/robocasa_reach.yaml
  robocasa_place: configs/experiment/cross_backend_adapter/robocasa_place.yaml
  libero_spatial_0: configs/experiment/cross_backend_adapter/libero_spatial_0.yaml
  libero_goal_0: configs/experiment/cross_backend_adapter/libero_goal_0.yaml
backends:
  jepa_wm_droid:
    methods: [base, dct_adapter, token_mlp, lora, hfra]
    models:
      robocasa_reach: configs/model/jepa_wm_droid_reach.yaml
      robocasa_place: configs/model/jepa_wm_droid_place.yaml
      libero_spatial_0: configs/model/jepa_wm_droid.yaml
      libero_goal_0: configs/model/jepa_wm_droid.yaml
  dino_wm_droid:
    methods: [base, lora, hfra]
    models:
      robocasa_reach: configs/model/dino_wm_droid_reach.yaml
      robocasa_place: configs/model/dino_wm_droid_place.yaml
      libero_spatial_0: configs/model/dino_wm_droid_reach.yaml
      libero_goal_0: configs/model/dino_wm_droid_reach.yaml
domains: [clean, ood]
seeds: [42, 7, 2026]
main: {episodes: 20}
data: {num_train_windows: 2000, split_seed: 42, window_seed: 42}
training: {max_optimizer_steps: 2000}
offline: {windows: 200}
appearance: {pipeline_version: composed_photometric_v1, main_severity: 1.0, seed: 2026}
ablations:
  backend: jepa_wm_droid
  tasks: [robocasa_place, libero_goal_0]
  variants: [hfra, hfra_core_only]
  domain: ood
  episodes: 20
gpu: {default_ids: [0, 1, 2, 3], one_heavy_job_per_gpu: true}
reuse_sources: {}
legacy_suites: [cross_benchmark_v1, cross_benchmark_v2]
self_test:
  roots:
    state_path: logs/cross_backend_adapter_v1_self_test/state.json
    pid_path: logs/cross_backend_adapter_v1_self_test/runner.pid
    log_root: logs/cross_backend_adapter_v1_self_test/jobs
    storage_root: storage/feature_cache/cross_backend_adapter_v1_self_test
    checkpoint_root: checkpoints/cross_backend_adapter_v1_self_test
    output_root: outputs/cross_backend_adapter_v1_self_test
    analysis_root: outputs/cross_backend_adapter_v1_self_test/analysis
